  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02Fspan>\n<sc-if value=\"{{chOff}}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{chStart}}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #FCD34D; color: #2A1F00; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer\">Lancer le défi<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{chNext}}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{chGo}}\" style=\"min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #FCD34D; color: #2A1F00; font-family: inherit; font-size: 14px; font-weight: 900; cursor: pointer\">{{chNextLabel}}<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<span class=\"swap\" style=\"font-size: 17px; font-weight: 700; line-height: 1.45; color: #FFFFFF\">{{chQ}}<\u002Fspan>\n<sc-if value=\"{{chHasFb}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"swap\" style=\"font-size: 15px; line-height: 1.5; color: {{chFbColor}}\">{{chFb}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 18px\">\n\n<div class=\"rise\" style=\"animation-delay: .2s; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: #17123A; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<span style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #C4B5FD\">Organisations dont la Guinée est membre<\u002Fspan>\n<div role=\"group\" aria-label=\"Mode d'affichage\" style=\"display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.05)\">\n<button sc-camel-on-click=\"{{viewOrg}}\" aria-pressed=\"{{vOrgP}}\" style=\"min-height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: {{vOrgBg}}; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer\">Par organisation<\u002Fbutton>\n<button sc-camel-on-click=\"{{viewOv}}\" aria-pressed=\"{{vOvP}}\" style=\"min-height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: {{vOvBg}}; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer\">Chevauchements<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{orgsIn}}\" as=\"o\" hint-placeholder-count=\"8\">\n<button class=\"chip\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.pressed}}\" style=\"min-height: 52px; padding: 8px 10px; border-radius: 12px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform .2s\">\n<span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{o.color}}; flex-shrink: 0\"><\u002Fspan>\n<span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 15px; font-weight: 900\">{{o.sig}}<\u002Fspan><span style=\"font-size: 11px; color: #B9B0DA\">{{o.n}} membres<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #8F86B8; padding-top: 4px\">Pièges fréquents : la Guinée n'en est pas membre<\u002Fspan>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{orgsOut}}\" as=\"o\" hint-placeholder-count=\"3\">\n<button class=\"chip\" sc-camel-on-click=\"{{o.pick}}\" aria-pressed=\"{{o.pressed}}\" style=\"min-height: 44px; padding: 8px 10px; border-radius: 12px; border: 1px dashed {{o.border}}; background: {{o.bg}}; color: #D9D3F2; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; transition: transform .2s\">{{o.sig}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{showOrg}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"swap rise\" style=\"animation-delay: .3s; border-radius: 22px; border: 1px solid {{org.border}}; background: linear-gradient(165deg, #1F1850 0%, #15103A 100%); padding: 24px 26px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 14px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<span style=\"font-family: 'Cormorant Garamond', serif; font-size: 40px; line-height: 1; color: {{org.color}}\">{{org.sig}}<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; color: #FFFFFF\">{{org.name}}<\u002Fspan>\n<span style=\"font-size: 13px; color: #B9B0DA\">Siège : {{org.seat}} · {{org.rdc}}<\u002Fspan>\n<\u002Fdiv>\n<span style=\"padding: 7px 12px; border-radius: 999px; background: {{org.badgeBg}}; color: {{org.color}}; font-size: 12px; font-weight: 900; white-space: nowrap\">{{org.approach}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n<div style=\"padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #8F86B8\">Approche réglementaire<\u002Fspan><span style=\"font-size: 14px; line-height: 1.5; color: #E9E5FA\">{{org.how}}<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #8F86B8\">Effet en droit guinéen<\u002Fspan><span style=\"font-size: 14px; line-height: 1.5; color: #E9E5FA\">{{org.effect}}<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #8F86B8\">Juridiction<\u002Fspan><span style=\"font-size: 14px; line-height: 1.5; color: #E9E5FA\">{{org.court}}<\u002Fspan><\u002Fdiv>\n<div style=\"padding: 14px 16px; border-radius: 14px; background: rgba(139,92,246,0.10); border: 1px solid rgba(167,139,250,0.25); display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #C4B5FD\">Enjeu pour la donnée juridique<\u002Fspan><span style=\"font-size: 14px; line-height: 1.5; color: #E9E5FA\">{{org.data}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showOverlap}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"swap\" style=\"border-radius: 22px; border: 1px solid rgba(167,139,250,0.35); background: linear-gradient(165deg, #1F1850 0%, #15103A 100%); padding: 24px 26px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Cormorant Garamond', serif; font-size: 34px; line-height: 1.05; color: #FFFFFF\">Le « bol de spaghettis » régional<\u002Fspan>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #E9E5FA\">La carte compte, pour chaque État, le nombre d'organisations sous-régionales (OHADA, CEDEAO, ZMAO, Union du fleuve Mano, OMVS, OMVG, ABN) qu'il partage avec la Guinée. Le Sénégal et la Côte d'Ivoire en partagent quatre.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #E9E5FA\">Ces appartenances multiples créent des obligations parfois concurrentes : un État ne peut appliquer simultanément deux tarifs extérieurs communs différents. La ZLECAf vise à rationaliser cet enchevêtrement.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div class=\"rise\" style=\"animation-delay: .4s; border-radius: 22px; border: 1px solid rgba(255,255,255,0.10); background: #17123A; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; min-height: 120px\">\n<span style=\"font-size: 12px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #FCD34D\">Pays sélectionné<\u002Fspan>\n<sc-if value=\"{{noCountry}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 15px; color: #B9B0DA\">Cliquez sur un pays de la carte pour afficher ses appartenances.<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{hasCountry}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"swap\" style=\"display: flex; flex-direction: column; gap: 10px\">\n<span style=\"font-size: 20px; font-weight: 900; color: #FFFFFF\">{{cty.name}}<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{cty.orgs}}\" as=\"m\" hint-placeholder-count=\"4\">\n<span style=\"padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 900; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}\">{{m.sig}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 13px; color: #B9B0DA\">{{cty.shared}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin: 0; font-size: 12px; font-style: italic; color: #8F86B8\">Fonds de carte Natural Earth (domaine public), simplifié ; frontières indicatives. Appartenances à jour à la date du document, à vérifier avant toute publication officielle.<\u002Fp>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1200}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.NAMES = {AGO:'Angola',BDI:'Burundi',BEN:'Bénin',BFA:'Burkina Faso',BWA:'Botswana',CAF:'Centrafrique',CIV:'Côte d’Ivoire',CMR:'Cameroun',COD:'République démocratique du Congo',COG:'République du Congo',DJI:'Djibouti',DZA:'Algérie',EGY:'Égypte',ERI:'Érythrée',ETH:'Éthiopie',GAB:'Gabon',GHA:'Ghana',GIN:'Guinée',GMB:'Gambie',GNB:'Guinée-Bissau',GNQ:'Guinée équatoriale',KEN:'Kenya',LBR:'Liberia',LBY:'Libye',LSO:'Lesotho',MAR:'Maroc',MDG:'Madagascar',MLI:'Mali',MOZ:'Mozambique',MRT:'Mauritanie',MWI:'Malawi',NAM:'Namibie',NER:'Niger',NGA:'Nigeria',RWA:'Rwanda',SAH:'Sahara occidental',SDN:'Soudan',SDS:'Soudan du Sud',SEN:'Sénégal',SLE:'Sierra Leone',SOM:'Somalie',SWZ:'Eswatini',TCD:'Tchad',TGO:'Togo',TUN:'Tunisie',TZA:'Tanzanie',UGA:'Ouganda',ZAF:'Afrique du Sud',ZMB:'Zambie',ZWE:'Zimbabwe',STP:'São Tomé-et-Principe',COM:'Comores',MUS:'Maurice',SYC:'Seychelles',CPV:'Cabo Verde'};\n    this.CENT = {TZA:[528,444],SAH:[51,136],COD:[397,420],SOM:[640,328],KEN:[559,376],SDN:[482,229],TCD:[367,226],ZAF:[426,664],LSO:[462,676],ZWE:[470,569],BWA:[426,602],NAM:[364,610],SEN:[34,236],MLI:[140,204],MRT:[70,170],BEN:[203,288],NER:[261,204],NGA:[266,290],CMR:[302,307],TGO:[190,296],GHA:[170,301],CIV:[124,306],GIN:[66,280],GNB:[28,262],LBR:[86,316],SLE:[63,296],BFA:[164,256],CAF:[390,313],COG:[328,386],GAB:[296,388],GNQ:[283,364],ZMB:[457,511],MWI:[522,510],MOZ:[535,565],SWZ:[494,645],AGO:[358,499],BDI:[479,414],MDG:[649,568],GMB:[27,245],TUN:[275,42],DZA:[196,99],ERI:[577,228],MAR:[90,94],EGY:[488,112],LBY:[352,116],ETH:[584,288],DJI:[605,262],UGA:[503,366],RWA:[479,400],SDS:[476,302],STP:[246,377],COM:[613,499],MUS:[740,583],SYC:[728,427],CPV:[16,200]};\n    this.CODES = Object.keys(this.NAMES);\n    const all = this.CODES.slice();\n    this.ORGS = [\n      { id:'UA', sig:'UA', name:'Union africaine', color:'#FCD34D', in:true, seat:'Addis-Abeba', rdc:'membre fondateur de l’OUA (1963)', approach:'Cadre continental', m: all,\n        how:'Acte constitutif et conventions continentales (droits de l’homme, cybersécurité, protection des données), applicables après signature et ratification.',\n        effect:'Les conventions ratifiées et publiées ont une autorité supérieure aux lois (la Constitution), sous réserve de réciprocité.',\n        court:'Cour africaine des droits de l’homme et des peuples (Arusha), dans la limite des protocoles ratifiés.',\n        data:'Référentiel des standards continentaux, notamment en matière de protection des données personnelles.' },\n      { id:'ZLECAF', sig:'ZLECAf', name:'Zone de libre-échange continentale africaine', color:'#FB923C', in:true, seat:'Accra (Secrétariat)', rdc:'État partie à l’Accord', approach:'Libéralisation', m: all.filter((c) => c !== 'ERI'),\n        how:'Accord-cadre et protocoles : marchandises, services, investissement, concurrence, propriété intellectuelle, commerce numérique.',\n        effect:'En cas de conflit avec un accord régional, l’Accord prévaut, sauf entre États ayant atteint une intégration plus poussée (art. 19).',\n        court:'Mécanisme interétatique de règlement des différends, inspiré de l’OMC.',\n        data:'Suivi des engagements commerciaux et des textes de mise en œuvre nationaux.' },\n      { id:'OHADA', sig:'OHADA', name:'Organisation pour l’harmonisation en Afrique du droit des affaires', color:'#A78BFA', in:true, seat:'Yaoundé (Secrétariat permanent)', rdc:'État membre', approach:'Uniformisation', m:['BEN','BFA','CMR','CAF','COM','COG','CIV','GAB','GIN','GNB','GNQ','MLI','NER','COD','SEN','TCD','TGO'],\n        how:'Actes uniformes directement applicables, sans transposition : sociétés, sûretés, recouvrement, procédures collectives, arbitrage, droit commercial général.',\n        effect:'Supranationalité : les Actes uniformes s’appliquent nonobstant toute disposition contraire de droit interne, antérieure ou postérieure (art. 10 du Traité).',\n        court:'CCJA (Abidjan) : juge de cassation pour l’application des Actes uniformes, en lieu et place de la Cour suprême de Guinée.',\n        data:'Socle de la base LegOmnia en construction : jurisprudence CCJA et décisions guinéennes appliquant les Actes uniformes.' },\n      { id:'CEDEAO', sig:'CEDEAO', name:'Communauté économique des États de l’Afrique de l’Ouest', color:'#5EEAD4', in:true, seat:'Abuja', rdc:'membre fondateur (1975)', approach:'Intégration régionale', m:['BEN','CPV','CIV','GMB','GHA','GIN','GNB','LBR','NGA','SEN','SLE','TGO'],\n        how:'Traité révisé, protocoles (libre circulation, commerce) et actes additionnels, adoptés par les organes communautaires.',\n        effect:'Les traités et protocoles ratifiés ont une autorité supérieure aux lois (la Constitution), sous réserve de réciprocité.',\n        court:'Cour de justice de la CEDEAO (Abuja), saisissable directement par les particuliers en matière de droits de l’homme.',\n        data:'Jurisprudence de la Cour de la CEDEAO, notamment en droits de l’homme, et textes sur la libre circulation.' },\n      { id:'ZMAO', sig:'ZMAO', name:'Zone monétaire de l’Afrique de l’Ouest', color:'#FDA4AF', in:true, seat:'Accra (Institut monétaire)', rdc:'État membre', approach:'Coopération monétaire', m:['GMB','GHA','GIN','LBR','NGA','SLE'],\n        how:'Regroupement de six États de la CEDEAO hors franc CFA, chacun doté de sa propre monnaie, engagés dans une convergence monétaire.',\n        effect:'Engagements de convergence soumis au régime général des traités.',\n        court:'Pas de juridiction propre.',\n        data:'Textes de coordination monétaire et de convergence macroéconomique.' },\n      { id:'MRU', sig:'UFM', name:'Union du fleuve Mano', color:'#C084FC', in:true, seat:'Freetown', rdc:'État membre', approach:'Coopération & sécurité', m:['LBR','SLE','GIN','CIV'],\n        how:'Coopération économique et sécuritaire entre quatre États voisins : Liberia, Sierra Leone, Guinée et Côte d’Ivoire.',\n        effect:'Accords de coopération soumis au régime général des traités (la Constitution).',\n        court:'Pas de juridiction communautaire.',\n        data:'Textes de coopération transfrontalière entre États voisins.' },\n      { id:'OMVS', sig:'OMVS', name:'Organisation pour la mise en valeur du fleuve Sénégal', color:'#60A5FA', in:true, seat:'Dakar', rdc:'membre depuis 2006', approach:'Gestion d’un bassin', m:['SEN','MLI','MRT','GIN'],\n        how:'Gestion commune du fleuve Sénégal : ouvrages partagés, énergie, navigation, irrigation, répartition des eaux.',\n        effect:'Conventions soumises au régime général des traités (la Constitution).',\n        court:'Pas de juridiction communautaire.',\n        data:'Conventions de bassin et textes sur la gestion des ouvrages communs.' },\n      { id:'OMVG', sig:'OMVG', name:'Organisation pour la mise en valeur du fleuve Gambie', color:'#2DD4BF', in:true, seat:'Dakar', rdc:'membre fondateur (1978)', approach:'Gestion d’un bassin', m:['SEN','GMB','GIN','GNB'],\n        how:'Gestion commune des bassins de la Gambie et des fleuves voisins : énergie, interconnexion électrique, aménagements.',\n        effect:'Conventions soumises au régime général des traités (la Constitution).',\n        court:'Pas de juridiction communautaire.',\n        data:'Conventions de bassin et textes sur les ouvrages et l’énergie partagés.' },\n      { id:'ABN', sig:'ABN', name:'Autorité du bassin du Niger', color:'#F472B6', in:true, seat:'Niamey', rdc:'État membre', approach:'Gestion d’un bassin', m:['BEN','BFA','CMR','TCD','CIV','GIN','MLI','NER','NGA'],\n        how:'Gestion concertée du bassin du fleuve Niger entre neuf États : ressources en eau, ouvrages, environnement.',\n        effect:'Conventions soumises au régime général des traités (la Constitution).',\n        court:'Pas de juridiction communautaire.',\n        data:'Charte de l’eau du bassin et textes sur la gestion des ressources partagées.' },\n      { id:'UEMOA', sig:'UEMOA', name:'Union économique et monétaire ouest-africaine', color:'#94A3B8', in:false, seat:'Ouagadougou', rdc:'la Guinée n’est pas membre', approach:'Non applicable', m:['BEN','BFA','CIV','GNB','MLI','NER','SEN','TGO'],\n        how:'Union économique et monétaire de huit États partageant le franc CFA émis par la BCEAO.',\n        effect:'Aucun effet en Guinée, qui dispose de sa propre monnaie, le franc guinéen.',\n        court:'—',\n        data:'Confusion fréquente : la plupart des voisins de la Guinée sont membres de l’UEMOA.' },\n      { id:'CEMAC', sig:'CEMAC', name:'Communauté économique et monétaire de l’Afrique centrale', color:'#94A3B8', in:false, seat:'Bangui', rdc:'la Guinée n’est pas membre', approach:'Non applicable', m:['CMR','CAF','TCD','COG','GAB','GNQ'],\n        how:'Union économique et monétaire de six États d’Afrique centrale.',\n        effect:'Aucun effet en Guinée.',\n        court:'—',\n        data:'À ne pas confondre avec la Guinée équatoriale, membre de la CEMAC.' },\n      { id:'ENTENTE', sig:'Entente', name:'Conseil de l’Entente', color:'#94A3B8', in:false, seat:'Abidjan', rdc:'la Guinée n’est pas membre', approach:'Non applicable', m:['CIV','BFA','NER','BEN','TGO'],\n        how:'Organisation de coopération entre cinq États d’Afrique de l’Ouest, fondée en 1959.',\n        effect:'Aucun effet en Guinée.',\n        court:'—',\n        data:'Organisation de coopération sans lien avec la Guinée.' }\n    ];\n    this.SUB = ['OHADA','CEDEAO','ZMAO','MRU','OMVS','OMVG','ABN'];\n    this.CH = [\n      { q:'Cliquez sur l’État où siège la CCJA, juge de cassation de l’OHADA.', ok:['CIV'], e:'La CCJA siège à Abidjan, en Côte d’Ivoire.' },\n      { q:'Le fleuve Sénégal prend sa source en Guinée. Cliquez sur l’État où siège l’OMVS.', ok:['SEN'], e:'L’OMVS a son siège à Dakar, au Sénégal.' },\n      { q:'Cliquez sur un autre membre de l’Union du fleuve Mano.', ok:['LBR','SLE','CIV'], e:'Le Liberia, la Sierra Leone et la Côte d’Ivoire forment l’Union du fleuve Mano avec la Guinée.' },\n      { q:'Cliquez sur l’État où siège l’Autorité du bassin du Niger.', ok:['NER'], e:'L’ABN a son siège à Niamey, au Niger.' },\n      { q:'Cliquez sur l’État où siège la Cour de justice de la CEDEAO.', ok:['NGA'], e:'La Cour de justice de la CEDEAO siège à Abuja, au Nigeria.' },\n      { q:'Piège : cliquez sur un voisin de la Guinée qui n’est pas membre de l’OHADA.', ok:['SLE','LBR'], e:'Exact : la Sierra Leone et le Liberia ne sont pas membres de l’OHADA.' }\n    ];\n    this.state = { org:'OHADA', view:'org', country:null, ch:{ on:false, i:0, score:0, solved:false, fb:null, ok:false, done:false } };\n  }\n  orgsOf(code) { return this.ORGS.filter((o) => o.m.indexOf(code) >= 0); }\n  shared(code) { return this.SUB.filter((id) => { const o = this.ORGS.find((x) => x.id === id); return o.m.indexOf(code) >= 0 && o.m.indexOf('GIN') >= 0; }).length; }\n  clickCountry(code) {\n    const ch = this.state.ch;\n    if (ch.on && !ch.solved && !ch.done) {\n      const c = this.CH[ch.i];\n      if (c.ok.indexOf(code) >= 0) this.setState({ country: code, ch: Object.assign({}, ch, { solved: true, score: ch.score + 1, ok: true, fb: 'Bravo ! ' + c.e }) });\n      else this.setState({ country: code, ch: Object.assign({}, ch, { ok: false, fb: 'Non, ce n’est pas ' + this.NAMES[code] + '. Réessayez.' }) });\n      return;\n    }\n    this.setState({ country: code });\n  }\n  renderVals() {\n    const s = this.state; const org = this.ORGS.find((o) => o.id === s.org);\n    const f = {}, p = {}, dl = {};\n    const scale = ['#2A2259', '#3E2F8A', '#5A40B8', '#7C5CE0', '#B39DFF'];\n    const c0 = this.CENT.GIN;\n    this.CODES.forEach((code) => {\n      const c = this.CENT[code];\n      const d = Math.hypot(c[0] - c0[0], c[1] - c0[1]);\n      dl[code] = (d / 900).toFixed(2) + 's';\n      p[code] = () => this.clickCountry(code);\n      if (s.view === 'overlap') {\n        f[code] = code === 'GIN' ? '#5EEAD4' : scale[Math.min(this.shared(code), 4)];\n      } else {\n        const mem = org.m.indexOf(code) >= 0;\n        if (code === 'GIN') f[code] = org.in ? org.color : '#4A3F8F';\n        else f[code] = mem ? org.color : '#2A2259';\n      }\n    });\n    let links = 'M0 0';\n    if (s.view === 'org' && org.m.length < 25) {\n      links = org.m.filter((c) => c !== 'GIN').map((c) => {\n        const t = this.CENT[c]; const mx = (c0[0] + t[0]) / 2, my = (c0[1] + t[1]) / 2 - 30;\n        return 'M' + c0[0] + ' ' + c0[1] + ' Q' + mx + ' ' + my + ' ' + t[0] + ' ' + t[1];\n      }).join(' ') || 'M0 0';\n    }\n    const mk = (o) => {\n      const on = s.view === 'org' && s.org === o.id;\n      return { sig: o.sig, n: o.m.length, color: o.color, pressed: on ? 'true' : 'false',\n        bg: on ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.03)', border: on ? o.color : 'rgba(255,255,255,0.12)',\n        pick: () => this.setState({ org: o.id, view: 'org' }) };\n    };\n    const legend = s.view === 'overlap'\n      ? [{ c:'#5EEAD4', t:'Guinée' }, { c:scale[1], t:'1 organisation commune' }, { c:scale[2], t:'2 organisations' }, { c:scale[3], t:'3 organisations' }, { c:scale[4], t:'4 et plus' }]\n      : (org.in ? [{ c: org.color, t: 'États membres (' + org.m.length + ')' }, { c:'#2A2259', t:'Non membres' }] : [{ c: org.color, t:'Membres (' + org.m.length + ')' }, { c:'#4A3F8F', t:'Guinée, non membre' }]);\n    let cty = { name:'', orgs:[], shared:'' };\n    if (s.country) {\n      const os = this.orgsOf(s.country);\n      const n = this.shared(s.country);\n      cty = { name: this.NAMES[s.country],\n        orgs: os.length ? os.map((o) => ({ sig:o.sig, bg: o.in ? 'rgba(255,255,255,0.06)' : 'transparent', fg: o.in ? o.color : '#B9B0DA', bd: o.in ? o.color : 'rgba(255,255,255,0.2)' })) : [{ sig:'Aucune des organisations suivies', bg:'transparent', fg:'#B9B0DA', bd:'rgba(255,255,255,0.2)' }],\n        shared: s.country === 'GIN' ? 'La Guinée appartient à neuf organisations, de natures juridiques différentes.' : n + ' organisation(s) sous-régionale(s) en commun avec la Guinée, en plus de l’UA et de la ZLECAf.' };\n    }\n    const sc = s.country ? this.CENT[s.country] : [0, 0];\n    const ch = s.ch;\n    const chQ = !ch.on ? 'Six questions géographiques : cliquez directement sur la carte pour répondre.' : (ch.done ? 'Défi terminé : ' + ch.score + ' bonne(s) réponse(s) sur 6. ' + (ch.score === 6 ? 'Parfait, vous maîtrisez la géographie juridique régionale !' : 'Relancez pour viser le sans-faute.') : 'Question ' + (ch.i + 1) + '/6 : ' + this.CH[ch.i].q);\n    return {\n      f: f, p: p, dl: dl, links: links, linkColor: org.color,\n      selc: { x: sc[0], y: sc[1], r: s.country ? 16 : 0 },\n      orgsIn: this.ORGS.filter((o) => o.in).map(mk), orgsOut: this.ORGS.filter((o) => !o.in).map(mk),\n      org: Object.assign({}, org, { border: org.in ? org.color + '66' : 'rgba(148,163,184,0.4)', badgeBg: 'rgba(255,255,255,0.07)' }),\n      showOrg: s.view === 'org', showOverlap: s.view === 'overlap',\n      legend: legend, legendTitle: s.view === 'overlap' ? 'Organisations partagées avec la Guinée' : org.sig, legendColor: s.view === 'overlap' ? '#C4B5FD' : org.color,\n      vOrgP: s.view === 'org' ? 'true' : 'false', vOvP: s.view === 'overlap' ? 'true' : 'false',\n      vOrgBg: s.view === 'org' ? '#8B5CF6' : 'transparent', vOvBg: s.view === 'overlap' ? '#8B5CF6' : 'transparent',\n      viewOrg: () => this.setState({ view: 'org' }), viewOv: () => this.setState({ view: 'overlap' }),\n      hasCountry: !!s.country, noCountry: !s.country, cty: cty,\n      chScore: ch.on ? ch.score + ' / 6' : '6 questions',\n      chOff: !ch.on, chNext: ch.on && (ch.solved || ch.done), chNextLabel: ch.done ? 'Rejouer' : (ch.i === 5 ? 'Voir le résultat' : 'Question suivante'),\n      chQ: chQ, chHasFb: ch.on && !!ch.fb && !ch.done, chFb: ch.fb || '', chFbColor: ch.ok ? '#5EEAD4' : '#FDE68A',\n      chStart: () => this.setState({ ch: { on:true, i:0, score:0, solved:false, fb:null, ok:false, done:false } }),\n      chGo: () => {\n        const c = this.state.ch;\n        if (c.done) { this.setState({ ch: { on:true, i:0, score:0, solved:false, fb:null, ok:false, done:false } }); return; }\n        if (c.i === 5) this.setState({ ch: Object.assign({}, c, { done:true }) });\n        else this.setState({ ch: Object.assign({}, c, { i: c.i + 1, solved:false, fb:null, ok:false }) });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
