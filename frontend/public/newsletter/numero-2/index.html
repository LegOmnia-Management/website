}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1d1916; --paper-2: #26211d; --ink: #f4ebe2; --muted: #b5aaa0; --rule: #f4ebe2; --rule-soft: #3b342e;

  }
}
:root[data-theme="dark"] {
  --paper: #1d1916; --paper-2: #26211d; --ink: #f4ebe2; --muted: #b5aaa0; --rule: #f4ebe2; --rule-soft: #3b342e;

* { box-sizing: border-box; }
body {

}
a { color: var(--link); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
.wrap { max-width: 1040px; margin-inline: auto; }

/* Bandeau de démonstration */
.demo { font: 700 11px/1.5 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 10px 0 0; text-wrap: balance; }

/* Titre du journal */
.mast { border-top: 4px solid var(--rule); margin-top: 10px; padding-top: 14px; text-align: center; }
.mast .eyebrow { font: 700 11px var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--link); }

.dbl { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule-soft); height: 5px; margin-top: 14px; }

/* Navigation par domaine */
.chips { display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; padding: 16px 0 4px; }
.chips button { font: 700 12px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 7px 12px; cursor: pointer; }
.chips button:hover { background: var(--ink); color: var(--on-ink); }

/* Chiffres */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-top: 22px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.stat { padding: 14px 16px 14px 0; background: none; border: 0; border-right: 1px solid var(--rule-soft); text-align: left; cursor: pointer; font: inherit; color: inherit; min-width: 0; }
.stat:last-child { border-right: 0; }
.stat + .stat { padding-left: 16px; }
.stat b { display: block; font-size: 38px; line-height: 1.05; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat b small { font: 700 12px var(--f-ui); letter-spacing: .04em; margin-left: 6px; color: var(--link); text-transform: uppercase; }
.stat span { display: block; font: 13px/1.4 var(--f-ui); color: var(--muted); margin-top: 4px; }
.stat:hover b { color: var(--link); }

.label { font: 700 11px var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--link); }

/* Éditorial */
.edito { max-width: 760px; margin: 30px auto 0; }
.edito p { font-size: 21px; line-height: 1.55; font-style: italic; margin: 8px 0 0; text-wrap: pretty; }

.art { background: var(--ab); aspect-ratio: 16 / 9; width: 100%; overflow: hidden; display: block; }
.art svg { display: block; width: 100%; height: 100%; }
.art[data-d="droit"]   { --ab: #4a0f9d; --af: #fff1e5; --aa: #5ce1e6; }
.art[data-d="fisc"]    { --ab: #1f1a17; --af: #fff1e5; --aa: #e896f6; }
.art[data-d="num"]     { --ab: #6b63d0; --af: #fff1e5; --aa: #1a1a1a; }
.art[data-d="banque"]  { --ab: #12384a; --af: #fff1e5; --aa: #5ce1e6; }
.art[data-d="commerce"] { --ab: #6b63d0; --af: #fff1e5; --aa: #1a1a1a; }
.art[data-d="immo"] { --ab: #7a3b12; --af: #fff1e5; --aa: #5ce1e6; }
.art[data-d="social"] { --ab: #7a3b12; --af: #fff1e5; --aa: #5ce1e6; }
.art[data-d="penal"] { --ab: #1f1a17; --af: #fff1e5; --aa: #5ce1e6; }
.art[data-d="invest"]  { --ab: #5b2a52; --af: #fff1e5; --aa: #e896f6; }
.art .f  { fill: var(--af); }
.art .fm { fill: var(--af); opacity: .45; }
.art .a  { fill: var(--aa); }
.art .sf { stroke: var(--af); fill: none; }
.art .sa { stroke: var(--aa); fill: none; }
.art .t    { font: 700 17px Lato, Arial, sans-serif; fill: var(--af); letter-spacing: .03em; }
.art .tm   { font: 700 15px Lato, Arial, sans-serif; fill: var(--af); opacity: .85; }
.art .tb   { font: 700 28px "Ibarra Real Nova", Georgia, serif; fill: var(--af); }
.art .tbig { font: 700 72px "Ibarra Real Nova", Georgia, serif; fill: var(--af); text-anchor: middle; }

/* À la une */
.une { margin-top: 34px; border-top: 1px solid var(--rule); padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.une h2 { font-size: clamp(30px, 4.6vw, 44px); line-height: 1.1; font-weight: 700; margin: 8px 0 12px; text-wrap: balance; }
.une h2 a, .card h3 a { color: inherit; text-decoration: none; }
.une h2 a:hover, .card h3 a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.une .dek { font-size: 19px; color: var(--ink); margin: 0 0 14px; }
.meta { font: 12px var(--f-ui); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.tag { font: 700 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--rule); padding: 3px 7px; color: var(--ink); }
.read { font: 700 13px var(--f-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--link); text-decoration: none; }
.read:hover { text-decoration: underline; }
@media (max-width: 760px) { .une { grid-template-columns: minmax(0, 1fr); } .une .art { order: -1; } }

/* Rubriques */
.sec { margin-top: 44px; }
.sec-h { border-top: 2px solid var(--rule); padding-top: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font: 700 13px var(--f-ui); letter-spacing: .18em; text-transform: uppercase; margin: 0; }
.sec-h span { font: 12px var(--f-ui); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 30px 28px; margin-top: 18px; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card .kick { font: 700 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--link); }
.card h3 { font-size: 26px; line-height: 1.15; font-weight: 700; margin: 0; text-wrap: balance; }
.card p { font-size: 17px; line-height: 1.5; margin: 0; color: var(--ink); }
.card .art-link { display: block; }

/* Pied de page */
.foot { margin-top: 56px; border-top: 4px solid var(--rule); padding-top: 14px; font: 12px/1.65 var(--f-ui); color: var(--muted); max-width: 760px; }
.foot b { color: var(--link); }

/* Lecture d'un article */
.reader { max-width: 700px; margin-inline: auto; padding-top: 22px; }
.back { font: 700 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; background: none; border: 0; color: var(--link); cursor: pointer; padding: 6px 0; }

.reader .kick { margin-top: 18px; }

.byline { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule-soft); padding: 10px 0; margin-bottom: 20px; }
.reader .art { margin-bottom: 26px; }

.prose h2 { font-size: 26px; line-height: 1.2; margin: 1.6em 0 .5em; font-weight: 700; }
.prose ul { margin: 0 0 1.2em; padding-left: 1.2em; }
.prose li { margin-bottom: .45em; }
.note { font: 15px/1.6 var(--f-ui); background: var(--paper-2); border-top: 2px solid var(--violet); padding: 12px 16px; margin: 1.6em 0; }

.tablewrap { overflow-x: auto; margin: 0 0 1.4em; }
table { border-collapse: collapse; width: 100%; font: 15px/1.45 var(--f-ui); min-width: 480px; }
th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--rule); padding: 8px 10px 8px 0; }
td { border-bottom: 1px solid var(--rule-soft); padding: 9px 10px 9px 0; vertical-align: top; }

.fiche { border: 2px solid var(--rule); margin: 34px 0 28px; }

.fiche-h strong { font: 700 12px var(--f-ui); letter-spacing: .2em; text-transform: uppercase; }
.fiche-h span { font: 700 10.5px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--on-ink); padding: 3px 8px; }
.fiche dl { margin: 0; font: 15px/1.5 var(--f-ui); }
.fiche .row { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 4px 16px; padding: 10px 16px; border-top: 1px solid var(--rule-soft); }
.fiche .row:first-child { border-top: 0; }
.fiche dt { font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.fiche dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.fiche .verif { background: var(--paper-2); font: 13px/1.5 var(--f-ui); color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--rule); }
@media (max-width: 560px) { .fiche .row { grid-template-columns: minmax(0, 1fr); } }

.src h2 { font: 700 12px var(--f-ui); letter-spacing: .2em; text-transform: uppercase; border-top: 2px solid var(--rule); padding-top: 8px; margin: 0 0 8px; }
.src ul { font: 15px/1.5 var(--f-ui); margin: 0; padding-left: 1.1em; }
.src li { margin-bottom: 6px; overflow-wrap: anywhere; }
.pn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 36px; border-top: 1px solid var(--rule); padding-top: 16px; }
.pn a { text-decoration: none; color: inherit; display: block; }
.pn small { display: block; font: 700 11px var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--link); margin-bottom: 4px; }
.pn span { font-size: 18px; line-height: 1.25; font-weight: 700; }
.pn a:hover span { text-decoration: underline; }
.pn .next { text-align: right; }
@media (max-width: 560px) { .pn { grid-template-columns: minmax(0, 1fr); } .pn .next { text-align: left; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.score { display: inline-flex; gap: 3px; vertical-align: middle; }
.score i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }

.sig li { border-top: 1px solid var(--rule-soft); padding: 14px 0; }
.sig b { font: 700 11px var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--link); margin-right: 8px; }
.sig p { margin: 6px 0 2px; }
.sig small { font: 400 13px var(--f-ui); color: var(--muted); }
.sig-intro { font: 400 14px var(--f-ui); color: var(--muted); margin: 0 0 8px; }

.actu-i h3 { margin: 4px 0; font-size: 1.25rem; }
.btn { display: inline-block; background: var(--link); color: var(--paper); font: 700 13px var(--f-ui); padding: 10px 16px; text-decoration: none; }

const minutes = a => Math.max(2, Math.round(JSON.stringify(a.body).split(/\s+/).length / 210));
const MOIS = "9 novembre 2026";
const pastilles = n => `<span class="score" role="img" aria-label="Confiance ${n} sur 5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;

function artBlock(a, cls = "") {
  return `<div class="art ${cls}" data-d="${a.d}">${artSvg(a.art, esc(a.title))}</div>`;
}

function card(a) {
  return `<article class="card">
    <a class="art-link" href="#${a.id}" data-go="${a.id}" tabindex="-1" aria-hidden="true">${artBlock(a)}</a>
    <div class="kick">${tx(a.kicker)}</div>
    <h3><a href="#${a.id}" data-go="${a.id}">${tx(a.title)}</a></h3>
    <p>${tx(a.dek)}</p>
    <div class="meta"><span class="tag">${tx(a.status)}</span><span>${minutes(a)} min</span><a class="read" href="#${a.id}" data-go="${a.id}">Lire →</a></div>
  </article>`;
}

function home() {
  const une = ARTS.find(a => a.une);
  const secs = Object.entries(DOMAINS).map(([k, d]) => {
    const list = ARTS.filter(a => a.d === k && !a.une);
    const all = ARTS.filter(a => a.d === k).length;
    if (!list.length) return "";
    return `<section class="sec" id="sec-${k}">
      <div class="sec-h"><h2>${tx(d.label)}</h2><span>${all} article${all > 1 ? "s" : ""}</span></div>
      <div class="grid">${list.map(card).join("")}</div>
    </section>`;
  });
  return `
  <div class="wrap">
    <header class="mast">
      <div class="eyebrow">Édition hebdomadaire</div>
      <h1>La Revue de Presse Juridique d'Afrique Francophone</h1>
      <div class="par">par LegOmnia</div>
      <div class="date">Numéro 2 · semaine du 2 au 9 novembre 2026 · ${ARTS.length} sujets</div>
      <div class="date ia">Préparée avec l'appui d'outils d'IA, relue et validée par l'équipe LegOmnia</div>
      <div class="dbl"></div>
    </header>
    <nav class="chips" aria-label="Domaines">${Object.entries(DOMAINS).map(([k, d]) => `<button type="button" data-scroll="sec-${k}">${tx(d.short)}</button>`).join("")}</nav>
    <div class="stats">${STATS.map(s => `<button type="button" class="stat" data-go="${s.id}"><b>${tx(s.n)}<small>${tx(s.u)}</small></b><span>${tx(s.l)}</span></button>`).join("")}</div>
    <section class="edito"><div class="label">Éditorial</div><p>${tx(EDITO)}</p></section>
    <section class="une" aria-label="À la une">
      <div>
        <div class="label">${une.grand ? "Le grand format" : "À la une"} · ${tx(DOMAINS[une.d].short)}</div>
        <h2><a href="#${une.id}" data-go="${une.id}">${tx(une.title)}</a></h2>
        <p class="dek">${tx(une.dek)}</p>
        <div class="meta"><span class="tag">${tx(une.status)}</span><span>${minutes(une)} min de lecture</span><a class="read" href="#${une.id}" data-go="${une.id}">Lire l'article →</a></div>
      </div>
      <a class="art-link" href="#${une.id}" data-go="${une.id}" tabindex="-1" aria-hidden="true">${artBlock(une)}</a>
    </section>
    ${secs.join("")}
    <section class="sec actu" id="sec-actu"><div class="sec-h"><h2>L'actualité LegOmnia</h2><span>blog et produits</span></div>${ACTU.map(x => `<article class="actu-i"><div class="kick">${tx(x.k)}</div><h3><a href="${x.u}" target="_blank" rel="noopener noreferrer">${tx(x.t)}</a></h3><p>${tx(x.d)}</p><a class="btn" href="${x.u}" target="_blank" rel="noopener noreferrer">${tx(x.b)}</a></article>`).join("")}<p class="cta-site"><a class="btn btn-2" href="${SITE}" target="_blank" rel="noopener noreferrer">Découvrir LegOmnia</a></p></section>
    <footer class="foot">
      <b>LegOmnia</b> · Infrastructure juridique de l'Afrique francophone. Cette newsletter informe et ne constitue pas un conseil juridique. Cette newsletter est préparée avec l'appui d'outils d'intelligence artificielle, puis relue et validée par l'équipe LegOmnia, qui en assume la responsabilité éditoriale. Les faits sont tirés des sources citées en fin de chaque article, consultées le ${MOIS} ; chaque article signale ce qui reste à vérifier dans les textes officiels. Les illustrations sont originales.
    </footer>
  </div>`;
}

function body(items) {
  return items.map(b => {
    if (typeof b === "string") return `<p>${tx(b)}</p>`;
    if (b.h) return `<h2>${tx(b.h)}</h2>`;
    if (b.ul) return `<ul>${b.ul.map(li => `<li>${tx(li)}</li>`).join("")}</ul>`;
    if (b.note) {
      const i = b.note.indexOf(".");
      return `<div class="note"><b>${tx(b.note.slice(0, i + 1))}</b>${tx(b.note.slice(i + 1))}</div>`;
    }
    if (b.table) return `<div class="tablewrap"><table><thead><tr>${b.table.head.map(h => `<th>${tx(h)}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r => `<tr>${r.map(c => `<td>${tx(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    return "";
  }).join("");
}

function reader(a) {
  const i = ARTS.indexOf(a);
  const prev = ARTS[(i + ARTS.length - 1) % ARTS.length];
  const next = ARTS[(i + 1) % ARTS.length];
  return `
  <div class="wrap">
    <article class="reader">
      <button type="button" class="back" data-go="">← Retour à la newsletter</button>
      <div class="label kick">${tx(a.kicker)}</div>
      <h1>${tx(a.title)}</h1>
      <p class="dek">${tx(a.dek)}</p>
      <div class="byline meta"><span>Rédaction LegOmnia · veille juridique</span><span>${MOIS}</span><span>${minutes(a)} min de lecture</span><span class="tag">${tx(DOMAINS[a.d].short)}</span></div>
      ${artBlock(a)}
      <div class="prose">${body(a.body)}</div>
      <section class="fiche" aria-label="Fiche juridique">
        <div class="fiche-h"><strong>Fiche juridique</strong><span>${tx(a.status)}</span></div>
        <dl>${a.fiche.map(([k, v]) => `<div class="row"><dt>${tx(k)}</dt><dd>${tx(v)}</dd></div>`).join("")}</dl>
        <div class="verif"><b>Vérification.</b> ${tx(a.verif)}</div>
      </section>
      <section class="src"><h2>Sources</h2><ul>${a.sources.map(s => `<li><a href="${s.u}" target="_blank" rel="noopener noreferrer">${tx(s.t)}</a></li>`).join("")}</ul></section>
      <nav class="pn" aria-label="Autres articles">
        <a href="#${prev.id}" data-go="${prev.id}"><small>← Précédent</small><span>${tx(prev.title)}</span></a>
        <a class="next" href="#${next.id}" data-go="${next.id}"><small>Suivant →</small><span>${tx(next.title)}</span></a>
      </nav>
    </article>
  </div>`;
}

let current;
function show(id) {
  const a = id && byId[id];
  if (current === (a ? a.id : "") && $app.firstChild) return;
  current = a ? a.id : "";
  $app.innerHTML = a ? reader(a) : home();
  document.title = a ? a.title + " · LegOmnia" : "La Revue de Presse Juridique d'Afrique Francophone · LegOmnia";
  window.scrollTo(0, 0);
}
function go(id) {
  show(id || "");
  try { if ((location.hash.slice(1)) !== (id || "")) location.hash = id || ""; } catch (e) { /* hash indisponible : la navigation interne suffit */ }
}

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
  const s = e.target.closest("[data-scroll]");
  if (s) { const el = document.getElementById(s.getAttribute("data-scroll")); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));

</script>
