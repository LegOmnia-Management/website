    .replace(/(\d) (\d{3})(?!\d)/g, "$1 $2")
    .replace(/ ([%:;?!»])/g, " $1")
    .replace(/« /g, "« ")
    .replace(/(\d) (FCFA|M€|milliards?|millions?|dollars|USD|Md|M|k|ans?|min|pays|jours?|voix)/g, "$1 $2");
}

  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.getAttribute("data-go")); return; }
  const s = e.target.closest("[data-scroll]");
  if (s) { const el = document.getElementById(s.getAttribute("data-scroll")); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
